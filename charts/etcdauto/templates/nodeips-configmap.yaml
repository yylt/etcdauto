{{- if .Values.nodeIpsConfigMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nodeIpsConfigMap.name }}
  namespace: {{ include "etcdauto.namespace" . }}
  labels:
    {{- include "etcdauto.labels" . | nindent 4 }}
data:
  {{- with .Values.nodeIpsConfigMap.data }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
