apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: default
spec:
  serviceName: etcd
  replicas: 3
  selector:
    matchLabels:
      app: etcd
      component: etcd-server
  template:
    metadata:
      labels:
        app: etcd
        component: etcd-server
    spec:
      containers:
      - name: etcd
        image: your-registry/etcdcluster:latest
        command:
        - etcdcluster
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: SERVICE_NAME
          value: etcd-server
        - name: CLI_NAME
          value: etcd
        - name: CLIENT_PORT
          value: "2479"
        - name: PEER_PORT
          value: "2480"
        - name: NODEIP_DIR
          value: /run/nodeip
        - name: MAX
          value: "5"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: INTERFACES
          value: br-roller,br-mgmt,br-storagepub
        ports:
        - name: client
          containerPort: 2479
          protocol: TCP
        - name: peer
          containerPort: 2480
          protocol: TCP
        # Liveness probe - checks if etcd process is alive
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - /run/etcd/livez.sh
          initialDelaySeconds: 10
          periodSeconds: 4
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - /run/etcd/readyz.sh
          initialDelaySeconds: 5
          periodSeconds: 4
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - mountPath: /run/etcd
          name: data
        - mountPath: /run/nodeip
          name: nodeips
        - mountPath: /run/ssl
          name: ssl
      volumes:
      - emptyDir:
          medium: Memory
        name: data
      - configMap:
          defaultMode: 420
          name: nodeips
        name: nodeips
      - name: ssl
        secret:
          defaultMode: 420
          items:
          - key: ca.pem
            path: ca.pem
          - key: ca-key.pem
            path: ca-key.pem
          secretName: etcd-ssl

---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: etcd
    component: etcd-server
  ports:
  - name: client
    port: 2479
    targetPort: 2479
    protocol: TCP
  - name: peer
    port: 2480
    targetPort: 2480
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: etcd
    component: etcd-server
  ports:
  - name: client
    port: 2479
    targetPort: 2479
    protocol: TCP
