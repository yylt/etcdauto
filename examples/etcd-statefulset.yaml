apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: default
spec:
  serviceName: etcd
  replicas: 3
  selector:
    matchLabels:
      app: etcd
      component: etcd-server
  template:
    metadata:
      labels:
        app: etcd
        component: etcd-server
    spec:
      containers:
      - name: etcd
        image: your-registry/etcdcluster:latest
        command:
        - /usr/local/bin/etcdcluster

        env:
        # Required environment variables
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IPS
          valueFrom:
            fieldRef:
              fieldPath: status.podIPs
        - name: SERVICE_NAME
          value: "etcd"
        - name: MAX
          value: "3"
        - name: NODEIP_DIR
          value: "/run/nodeip"
        - name: INTERFACES
          value: "eth0,eth1"
        - name: CLIENT_PORT
          value: "2479"
        - name: PEER_PORT
          value: "2480"
        - name: ETCD_DATA_DIR
          value: "/var/lib/etcd"
        - name: CERT_DIR
          value: "/run/etcd/ssl"
        - name: CA_FILE
          value: "/run/ssl/ca.pem"
        - name: CA_KEY_FILE
          value: "/run/ssl/ca-key.pem"
        - name: LABELS
          value: "component=etcd"

        # Health check script locations (optional)
        - name: READYZ_SCRIPT
          value: "/run/etcd/readyz.sh"
        - name: LIVEZ_SCRIPT
          value: "/run/etcd/livez.sh"
        - name: TIMEOUT
          value: "5"

        ports:
        - name: client
          containerPort: 2479
          protocol: TCP
        - name: peer
          containerPort: 2480
          protocol: TCP

        # Liveness probe - checks if etcd process is alive
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - /run/etcd/livez.sh
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe - checks if etcd is ready to serve
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - /run/etcd/readyz.sh
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: etcd-data
          mountPath: /var/lib/etcd
        - name: etcd-runtime
          mountPath: /run/etcd
        - name: etcd-certs
          mountPath: /run/ssl
          readOnly: true
        - name: nodeip
          mountPath: /run/nodeip
          readOnly: true

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi

      volumes:
      - name: etcd-runtime
        emptyDir: {}
      - name: etcd-certs
        secret:
          secretName: etcd-ca
          defaultMode: 0644
      - name: nodeip
        hostPath:
          path: /var/lib/etcd-nodeip
          type: DirectoryOrCreate

  volumeClaimTemplates:
  - metadata:
      name: etcd-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: etcd
    component: etcd-server
  ports:
  - name: client
    port: 2479
    targetPort: 2479
    protocol: TCP
  - name: peer
    port: 2480
    targetPort: 2480
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: etcd
    component: etcd-server
  ports:
  - name: client
    port: 2479
    targetPort: 2479
    protocol: TCP
