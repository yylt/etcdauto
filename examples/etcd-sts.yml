apiVersion: v1
kind: Service
metadata:
  name: etcd-server
  namespace: default
spec:
  clusterIP: None
  ports:
    - name: client
      port: 2479
      protocol: TCP
      targetPort: 2479
    - name: peer
      port: 2480
      protocol: TCP
      targetPort: 2480
  publishNotReadyAddresses: true
  selector:
    component: etcd
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd-server
  namespace: default
spec:
  podManagementPolicy: OrderedReady
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      component: etcd
  serviceName: etcd-server
  template:
    metadata:
      labels:
        component: etcd
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: openstack-control-plane
                operator: In
                values:
                - enabled
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: component
                operator: In
                values:
                - etcd
            topologyKey: kubernetes.io/hostname
      containers:
      - command:
        - etcdcluster
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: SERVICE_NAME
          value: etcd-server
        - name: CLI_NAME
          value: etcd
        - name: CLIENT_PORT
          value: "2479"
        - name: PEER_PORT
          value: "2480"
        - name: NODEIP_DIR
          value: /run/nodeip
        - name: MAX
          value: "5"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: INTERFACES
          value: br-roller,br-mgmt,br-storagepub
        image: multiarch/etcdcluster:dev
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - /run/etcd/readyz.sh
          failureThreshold: 6
          initialDelaySeconds: 10
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 5
        name: etcd-tmpfs
        ports:
        - containerPort: 2479
          name: client
          protocol: TCP
        - containerPort: 2480
          name: peer
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /run/etcd/readyz.sh
          failureThreshold: 4
          initialDelaySeconds: 5
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /run/etcd
          name: data
        - mountPath: /run/nodeip
          name: nodeips
        - mountPath: /run/ssl
          name: ssl
      dnsPolicy: ClusterFirst
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: etcdcluster
      serviceAccountName: etcdcluster
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          medium: Memory
        name: data
      - configMap:
          defaultMode: 420
          name: nodeips
        name: nodeips
      - name: ssl
        secret:
          defaultMode: 420
          items:
          - key: ca.pem
            path: ca.pem
          - key: ca-key.pem
            path: ca-key.pem
          secretName: ca-cert
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcdcluster
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcdcluster-role
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etcdcluster-binding
subjects:
- kind: ServiceAccount
  name: etcdcluster
  namespace: default
roleRef:
  kind: ClusterRole
  name: etcdcluster-role
  apiGroup: rbac.authorization.k8s.io
