apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd-ecsnode
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ecsnode
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ecsnode
    spec:
      containers:
      - command:
        - ecsnode
        - -config
        - /app/config.yaml
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: multiarch/etcdcluster:dev
        imagePullPolicy: Always
        name: ecsnode
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app
          name: etc
      dnsPolicy: ClusterFirst
      nodeSelector:
        openstack-control-plane: enabled
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: ecsnode
      serviceAccountName: ecsnode
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: ecsnode-etc
        name: etc
---
apiVersion: v1
data:
  ca-key.pem: 
  ca.pem: 
kind: Secret
metadata:
  name: ca-cert
  namespace: default
type: Opaque
---
apiVersion: v1
data:
  config.yaml: |-
    cert:
      enabled: true
      caSecretName: "ca-cert"
      clientSecretName: "client-crt"
      validityYears: 100
      organization: "etcdauto"
      commonName: "etcdauto-ca"

    configmap:
      name: nodeips
    ecsnode:
      namespace: glia
      interfaces:
      - roller
      - management
      - storagepub
      masterif: roller
    pod:
      labels:
        component: etcd
    service:
      name: etcd
      ports:
      - targetPort: 2479
        port: 2479
        protocol: TCP
    node:
      includeLabels:
        openstack-control-plane: enabled
      statefulsetName: "etcd-server"
      minReplicas: 3
      maxReplicas: 5
kind: ConfigMap
metadata:
  name: ecsnode-etc
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecsnode
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecsnode-role
rules:
  - apiGroups: ["cluster.ecas.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["", "coordination.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ecsnode-binding
subjects:
- kind: ServiceAccount
  name: ecsnode
  namespace: default
roleRef:
  kind: ClusterRole
  name: ecsnode-role
  apiGroup: rbac.authorization.k8s.io
